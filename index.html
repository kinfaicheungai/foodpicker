<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="今次揀咩">
<meta name="theme-color" content="#F97316">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23F97316'/%3E%3Ctext x='50' y='72' font-size='58' text-anchor='middle' font-family='sans-serif' fill='white'%3E%E9%81%B8%3C/text%3E%3C/svg%3E">
<title>今次揀咩 v4.0</title>
<style>
:root{
  --or:#F97316;--ord:#EA6A00;--orl:#FFF7ED;--orm:#FFEDD5;
  --ro:#F43F5E;--rol:#FFF1F2;
  --go:#F59E0B;--gol:#FFFBEB;
  --sl:#1E293B;--slm:#475569;--sll:#F8FAFC;
  --bd:#E2E8F0;--wh:#fff;
  --r:16px;--rs:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"Helvetica Neue",sans-serif;background:#F8FAFC;min-height:100vh;color:var(--sl);overscroll-behavior:none}

/* ── PAGES ── */
.page{display:none;min-height:100vh;flex-direction:column}
.page.active{display:flex;animation:pageIn .35s cubic-bezier(.22,1,.36,1)}
@keyframes pageIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
#pgHome.active{animation:homeIn .4s ease-out}
@keyframes homeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ── HOME PAGE ── */
#pgHome{background:linear-gradient(160deg,#FFF7ED,#FFF1F2)}
.home-header{padding:max(env(safe-area-inset-top),20px) 20px 16px;display:flex;align-items:center;justify-content:space-between}
.home-logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:42px;height:42px;border-radius:11px;background:var(--or);display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;font-weight:900;flex-shrink:0}
.logo-text{font-size:20px;font-weight:800;letter-spacing:-.3px}
.logo-text em{color:var(--or);font-style:normal}
.logo-ver{font-size:11px;color:var(--slm);margin-left:4px}
.home-body{flex:1;padding:0 16px 100px;overflow-y:auto}

/* List cards */
.section-title{font-size:13px;font-weight:700;color:var(--slm);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 10px}
.list-cards{display:flex;flex-direction:column;gap:10px}
.list-card{background:var(--wh);border-radius:var(--r);box-shadow:0 2px 8px rgba(249,115,22,.06),0 1px 3px rgba(0,0,0,.05);padding:16px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s;border:1.5px solid transparent;animation:cardIn .45s cubic-bezier(.22,1,.36,1) backwards}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.list-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(249,115,22,.12),0 2px 6px rgba(0,0,0,.06)}
.list-card:active{transform:scale(.97);transition-duration:.08s}
.card-emoji{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.card-info{flex:1;min-width:0}
.card-name{font-size:16px;font-weight:700;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-count{font-size:13px;color:var(--slm)}
.card-arrow{color:var(--slm);font-size:18px;flex-shrink:0}
.card-del{background:none;border:none;color:#CBD5E1;cursor:pointer;font-size:18px;padding:4px;flex-shrink:0}
.card-del:hover{color:var(--ro)}

/* Add list btn */
.add-list-btn{background:var(--wh);border:2px dashed var(--bd);border-radius:var(--r);padding:18px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;color:var(--slm);font-size:15px;font-weight:600;transition:all .2s;margin-top:4px}
.add-list-btn:hover{border-color:var(--or);color:var(--or);background:var(--orl)}

/* Finger entry */
/* Quick entries */
.quick-entry{background:linear-gradient(135deg,#1E293B,#0F172A);border-radius:var(--r);padding:16px;cursor:pointer;transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s;text-align:center;position:relative;overflow:hidden;box-shadow:0 4px 12px rgba(15,23,42,.2);animation:cardIn .45s cubic-bezier(.22,1,.36,1) backwards}
.quick-entry::before{content:'';position:absolute;top:-50%;left:-60%;width:40%;height:200%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);transform:rotate(20deg);transition:left .5s}
.quick-entry:hover::before{left:130%}
.quick-entry:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,23,42,.3)}
.quick-entry:active{transform:scale(.95);transition-duration:.08s}
.qe-icon{font-size:32px;margin-bottom:6px;display:inline-block;transition:transform .3s}
.quick-entry:hover .qe-icon{transform:scale(1.15) rotate(-6deg)}
.qe-title{font-size:15px;font-weight:700;color:#fff;margin-bottom:3px}
.qe-sub{font-size:12px;color:rgba(255,255,255,.5)}

/* Bottom tab bar */
.btab-bar{position:fixed;bottom:0;left:0;right:0;background:var(--wh);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:100}
.btab{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 4px 6px;cursor:pointer;border:none;background:none;color:var(--slm);font-size:11px;font-weight:600;gap:3px;transition:color .15s}
.btab .btic{font-size:22px;line-height:1}
.btab.on{color:var(--or)}

/* ── LIST PAGE ── */
#pgList{background:linear-gradient(160deg,#FFF7ED,#FFF1F2)}
.list-header{padding:max(env(safe-area-inset-top),14px) 16px 12px;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);flex-shrink:0}
.back-btn{background:none;border:none;font-size:24px;cursor:pointer;color:var(--slm);padding:4px;line-height:1}
.list-header-info{flex:1;min-width:0}
.list-header-name{font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-header-count{font-size:13px;color:var(--slm)}
.list-body{flex:1;overflow-y:auto;padding:12px 16px 120px}

/* Items card */
.card{background:var(--wh);border-radius:var(--r);box-shadow:0 1px 4px rgba(0,0,0,.07);padding:16px;margin-bottom:12px}
.clabel{font-size:11px;font-weight:700;color:var(--or);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.irow{display:flex;gap:8px}
.irow input{flex:1;border:1.5px solid var(--bd);border-radius:var(--rs);padding:10px 12px;font-size:15px;outline:none;background:var(--sll);color:var(--sl)}
.irow input:focus{border-color:var(--or);background:var(--wh)}
.badd{background:var(--or);color:#fff;border:none;border-radius:var(--rs);padding:10px 14px;font-size:20px;cursor:pointer;line-height:1;flex-shrink:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:6px}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--orm);border-radius:50px;padding:5px 10px;font-size:14px;font-weight:500;animation:tagIn .3s cubic-bezier(.34,1.56,.64,1) backwards}
@keyframes tagIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.tx{background:none;border:none;color:#94A3B8;cursor:pointer;font-size:13px;padding:0;line-height:1}
.tx:hover{color:var(--ro)}

/* Mode tabs */
.mode-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.mtab{border:1.5px solid var(--bd);background:var(--sll);border-radius:var(--rs);padding:10px 4px;font-size:12px;font-weight:600;cursor:pointer;text-align:center;color:var(--slm);transition:all .2s}
.mtab .ic{font-size:18px;display:block;margin-bottom:3px}
.mtab.on{border-color:var(--or);background:var(--orl);color:var(--or)}

/* Punish */
.togrow{display:flex;align-items:center;justify-content:space-between}
.tog{width:42px;height:24px;background:var(--bd);border-radius:50px;position:relative;cursor:pointer;border:none;flex-shrink:0}
.tog.on{background:var(--or)}
.tog::after{content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:3px;left:3px;transition:transform .2s}
.tog.on::after{transform:translateX(18px)}
.ptags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ptag{background:var(--rol);color:var(--ro);border-radius:50px;padding:5px 10px;font-size:13px;display:inline-flex;align-items:center;gap:4px}

/* Chest */
.chest-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:4px 0 8px}
.chest-item{width:76px;text-align:center;cursor:pointer}
.chest-box{width:76px;height:76px;border-radius:14px;background:linear-gradient(145deg,#FFF7ED,#FFEDD5);border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:30px;position:relative;overflow:hidden;transition:all .25s;box-shadow:0 2px 6px rgba(249,115,22,.08)}
.chest-item:hover .chest-box{border-color:var(--go);transform:translateY(-3px);box-shadow:0 6px 14px rgba(245,158,11,.25)}
.chest-item:active .chest-box{transform:scale(.92)}
@keyframes chestShake{0%,100%{transform:rotate(0)}15%{transform:rotate(-8deg) scale(1.05)}30%{transform:rotate(8deg) scale(1.08)}45%{transform:rotate(-6deg) scale(1.1)}60%{transform:rotate(6deg) scale(1.12)}75%{transform:rotate(-3deg) scale(1.15)}90%{transform:rotate(2deg) scale(1.18)}}
.chest-box.shaking{animation:chestShake .55s ease-in-out forwards}
@keyframes chestBurst{0%{box-shadow:0 0 0 0 rgba(252,211,77,.8),0 0 0 0 rgba(245,158,11,.5)}100%{box-shadow:0 0 0 24px rgba(252,211,77,0),0 0 0 48px rgba(245,158,11,0)}}
.chest-box.burst{animation:chestBurst .7s ease-out forwards}
@keyframes chestRevealPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.chest-box.revealed{animation:chestRevealPop .45s cubic-bezier(.34,1.56,.64,1) forwards}
.chest-item.faded{opacity:.3;pointer-events:none}
.chest-num{font-size:11px;color:var(--slm);margin-top:4px}
.chest-hint{text-align:center;font-size:13px;color:var(--slm);margin-top:6px}

/* Elim wheel */
.wheel-wrap{position:relative;display:flex;justify-content:center;align-items:center;padding:10px 0 6px}
.wptr{position:absolute;top:4px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:24px solid var(--ro);z-index:10;filter:drop-shadow(0 2px 3px rgba(244,63,94,.4));transform-origin:top center}
@keyframes ptrBounce{0%,100%{transform:translateX(-50%) rotate(0)}25%{transform:translateX(-50%) rotate(-12deg)}50%{transform:translateX(-50%) rotate(8deg)}75%{transform:translateX(-50%) rotate(-4deg)}}
.wptr.bounce{animation:ptrBounce .5s ease-out}
.wctr{position:absolute;width:28px;height:28px;background:#fff;border-radius:50%;border:3px solid var(--bd);top:50%;left:50%;transform:translate(-50%,-50%);z-index:10}
.einfo{text-align:center;font-size:13px;color:var(--slm);margin-bottom:6px}
.einfo b{color:var(--ro)}
.elog{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.etag{background:#F1F5F9;color:#94A3B8;border-radius:50px;padding:4px 10px;font-size:12px;text-decoration:line-through}
.ewtag{background:#FEF3C7;color:#92400E;border:2px solid var(--go);border-radius:50px;padding:4px 12px;font-size:13px;font-weight:700}

/* Dice */
.dice-count-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.dice-count-lbl{font-size:14px;font-weight:600;color:var(--slm)}
.dice-count-btns{display:flex;gap:8px}
.dcb{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--bd);background:var(--sll);font-size:15px;font-weight:700;cursor:pointer;color:var(--slm)}
.dcb.on{border-color:var(--or);background:var(--orl);color:var(--or)}
.dice-faces-wrap{display:flex;justify-content:center;gap:16px;padding:8px 0;min-height:80px;align-items:center}
.d-face{font-size:50px;line-height:1;display:inline-block;transition:transform .08s;filter:drop-shadow(0 3px 5px rgba(0,0,0,.15))}
@keyframes diceLand{0%{transform:translateY(-18px) scale(1.2)}55%{transform:translateY(0) scale(.92)}75%{transform:translateY(-5px) scale(1.04)}100%{transform:translateY(0) scale(1)}}
.d-face.land{animation:diceLand .5s cubic-bezier(.34,1.56,.64,1)}
.d-face.shake{transform:rotate(18deg) scale(1.12)}
.dice-total{text-align:center;font-size:15px;color:var(--sl);min-height:24px;font-weight:700;margin-top:4px}

/* Result */
.rarea{background:var(--sl);border-radius:var(--r);padding:20px;text-align:center;margin-bottom:12px;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rlbl{font-size:13px;color:#94A3B8;margin-bottom:5px}
.rwin{font-size:32px;font-weight:800;color:#FCD34D}
.rpun{background:rgba(244,63,94,.2);border-radius:50px;padding:6px 14px;font-size:13px;color:#FDA4AF;margin-top:8px}
.rempty{text-align:center}
.rei{font-size:34px;margin-bottom:5px}
.reh{font-size:14px;color:#64748B}

/* Play btn */
.bplay{width:100%;background:linear-gradient(135deg,#F97316,#EA6A00);color:#fff;border:none;border-radius:var(--r);padding:14px;font-size:16px;font-weight:800;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;box-shadow:0 4px 12px rgba(249,115,22,.3)}
.bplay:hover:not(:disabled){box-shadow:0 6px 18px rgba(249,115,22,.4);transform:translateY(-1px)}
.bplay:active:not(:disabled){transform:scale(.97);transition-duration:.08s}
.bplay::after{content:'';position:absolute;top:-50%;left:-60%;width:30%;height:200%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);transform:rotate(20deg);animation:btnShine 3s ease-in-out infinite}
@keyframes btnShine{0%,70%{left:-60%}100%{left:130%}}
.bplay:disabled::after{display:none}
.bplay:disabled{background:#CBD5E1;cursor:not-allowed}
.bplay.red{background:linear-gradient(135deg,#F43F5E,#E0294D);box-shadow:0 4px 12px rgba(244,63,94,.3)}
.bplay.red:hover:not(:disabled){box-shadow:0 6px 18px rgba(244,63,94,.4)}
.brow{display:flex;gap:8px;margin-top:8px}
.bsec{flex:1;background:var(--wh);border:1.5px solid var(--bd);border-radius:var(--rs);padding:10px;font-size:14px;font-weight:600;cursor:pointer;color:var(--slm)}

/* ── FINGER OVERLAY ── */
#fgOv{position:fixed;inset:0;z-index:8000;background:linear-gradient(160deg,#0F172A,#1E0A2E);display:none;flex-direction:column;touch-action:none}
#fgOv.show{display:flex}
.fg-hdr{display:flex;align-items:center;padding:max(env(safe-area-inset-top),14px) 16px 10px;flex-shrink:0}
.fg-back{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:50px;padding:8px 14px;color:#fff;font-size:14px;cursor:pointer}
.fg-ttl{flex:1;text-align:center;color:#fff;font-size:18px;font-weight:800;margin-right:70px}
.fg-bdy{flex:1;display:flex;flex-direction:column;padding:4px 14px max(env(safe-area-inset-bottom),16px);min-height:0}
.fg-mode-row{display:flex;gap:8px;margin-bottom:10px;flex-shrink:0}
.fg-mode-btn{flex:1;padding:8px 4px;border-radius:10px;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:rgba(255,255,255,.6);font-size:12px;font-weight:600;cursor:pointer}
.fg-mode-btn.on{border-color:var(--or);background:rgba(249,115,22,.25);color:#fff}
.fg-hint{text-align:center;color:rgba(255,255,255,.55);font-size:13px;margin-bottom:8px;flex-shrink:0}
.fg-cnt{text-align:center;color:#FCD34D;font-size:15px;font-weight:700;margin-bottom:8px;flex-shrink:0}
.fg-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:8px;flex:1;min-height:0}
.fg-cell{border-radius:14px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
.fg-cell .em{font-size:26px;pointer-events:none}
.fg-cell .nm{font-size:11px;color:rgba(255,255,255,.35);margin-top:2px;pointer-events:none}
.fg-cell.held{background:rgba(99,102,241,.45);border-color:#818CF8;transform:scale(.92)}
.fg-cell.winner{background:rgba(245,158,11,.35);border-color:#FCD34D;border-width:3px;animation:fgwin .5s ease-out}
.fg-cell.loser{opacity:.2;transform:scale(.88)}
@keyframes fgwin{0%{transform:scale(1)}40%{transform:scale(1.2)}70%{transform:scale(.95)}100%{transform:scale(1)}}
.fg-res{text-align:center;padding:10px;background:rgba(255,255,255,.08);border-radius:12px;margin-top:8px;flex-shrink:0;opacity:0;pointer-events:none;transition:opacity .3s}
.fg-res.show{opacity:1;pointer-events:auto}
.fg-res p{color:rgba(255,255,255,.6);font-size:13px;margin-bottom:4px}
.fg-res strong{color:#FCD34D;font-size:26px;display:block}
.fg-start{margin-top:8px;width:100%;background:var(--or);color:#fff;border:none;border-radius:12px;padding:14px;font-size:17px;font-weight:800;cursor:pointer;flex-shrink:0;opacity:0;pointer-events:none;transition:opacity .3s}
.fg-start.show{opacity:1;pointer-events:auto}

/* ── CELEB ── */
#celeb{position:fixed;inset:0;z-index:9000;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,10,20,.9);cursor:pointer}
#celeb.show{display:flex}
#ccanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cbox{position:relative;z-index:2;text-align:center;padding:28px 24px;animation:cpop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes cpop{0%{transform:scale(.4);opacity:0}65%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.clbl{font-size:14px;color:#94A3B8;margin-bottom:8px}
.cwin{font-size:50px;font-weight:900;color:#FCD34D;line-height:1.1;margin-bottom:12px;animation:winGlow 1.5s ease-in-out infinite;text-shadow:0 0 30px rgba(252,211,77,.5)}
@keyframes winGlow{0%,100%{text-shadow:0 0 25px rgba(252,211,77,.4)}50%{text-shadow:0 0 50px rgba(252,211,77,.8),0 0 80px rgba(245,158,11,.4)}}
.cpun{background:rgba(244,63,94,.25);border:1px solid rgba(244,63,94,.35);border-radius:50px;padding:8px 20px;font-size:14px;color:#FDA4AF;margin-bottom:22px}
.cclose{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.25);border-radius:50px;padding:11px 28px;font-size:14px;color:#fff;cursor:pointer;font-weight:600}

/* ── MODAL ── */
#modal{position:fixed;inset:0;z-index:7000;background:rgba(0,0,0,.5);display:none;align-items:flex-end}
#modal.show{display:flex}
.modal-box{background:var(--wh);border-radius:24px 24px 0 0;padding:24px 20px max(env(safe-area-inset-bottom),24px);width:100%;animation:slideUp .3s ease-out}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-title{font-size:18px;font-weight:800;margin-bottom:16px;text-align:center}
.modal-input-row{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.emoji-btn{width:52px;height:52px;border-radius:12px;border:1.5px solid var(--bd);background:var(--sll);font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-name-input{flex:1;border:1.5px solid var(--bd);border-radius:var(--rs);padding:12px;font-size:16px;outline:none}
.modal-name-input:focus{border-color:var(--or)}
.emoji-picker{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;max-height:160px;overflow-y:auto}
.ep-btn{width:44px;height:44px;border-radius:10px;border:1.5px solid transparent;background:var(--sll);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ep-btn.on{border-color:var(--or);background:var(--orl)}
.modal-actions{display:flex;gap:10px}
.modal-confirm{flex:1;background:var(--or);color:#fff;border:none;border-radius:var(--rs);padding:13px;font-size:16px;font-weight:700;cursor:pointer}
.modal-cancel{background:var(--sll);color:var(--slm);border:none;border-radius:var(--rs);padding:13px 18px;font-size:16px;cursor:pointer}

/* Weight panel */
.wpanel{margin-top:10px}
.wrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.wrow:last-child{border:none}
.wname{flex:1;font-size:14px}

// ── FIREBASE ──
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCt64Lu0QBqSWENHwoyv-5EfZhgUfooA8g",
  authDomain: "foodpicking-and-random.firebaseapp.com",
  databaseURL: "https://foodpicking-and-random-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "foodpicking-and-random",
  storageBucket: "foodpicking-and-random.firebasestorage.app",
  messagingSenderId: "282354344161",
  appId: "1:282354344161:web:c9ef9b57dfd6e4f83757a0"
};

const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);

window.fbSaveLists = function(lists) {
  set(ref(db,'picker/lists'), lists).catch(e=>console.log('FB save error',e));
};
window.fbSaveList = function(id, data) {
  set(ref(db,'picker/lists/'+id), data).catch(e=>console.log('FB save error',e));
};
window.fbDeleteList = function(id) {
  remove(ref(db,'picker/lists/'+id)).catch(e=>console.log('FB del error',e));
};

// Listen for changes
onValue(ref(db,'picker/lists'), (snap) => {
  const d = snap.val();
  if (!window._appReady) {
    // First load
    if (d && typeof d === 'object') {
      window._lists = Object.values(d).filter(l=>l&&l.id);
    }
    window._appReady = true;
    window._initApp && window._initApp();
  } else {
    // Live update
    if (d && typeof d === 'object') {
      window._lists = Object.values(d).filter(l=>l&&l.id);
    } else {
      window._lists = [];
    }
    window._renderLists && window._renderLists();
    // Update current list if open
    if (window._curListId) {
      const cur = window._lists.find(l=>l.id===window._curListId);
      if (cur) { window._curList = cur; window._renderItems && window._renderItems(); }
    }
    showToast('☁️ 雲端數據已同步');
  }
});

<script>
// ── SOUND & HAPTICS ──
let soundOn = true;
try { soundOn = localStorage.getItem('picker_sound') !== '0'; } catch(e){}
let _actx = null;
function actx(){ if(!_actx){ try{_actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return _actx; }
function tone(freq, dur, vol, type, delay) {
  if(!soundOn) return;
  const ctx = actx(); if(!ctx) return;
  try {
    const t0 = ctx.currentTime + (delay||0);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type||'sine'; o.frequency.value = freq;
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(vol||.1, t0);
    g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
    o.start(t0); o.stop(t0 + dur);
  } catch(e){}
}
function sTick(){ tone(900,.04,.06,'square'); }
function sPop(){ tone(520,.1,.12,'sine'); tone(780,.12,.08,'sine',.04); }
function sOpen(){ tone(392,.12,.1,'triangle'); tone(523,.14,.1,'triangle',.08); tone(659,.2,.12,'triangle',.16); }
function sWin(){ [523,659,784,1047].forEach((f,i)=>tone(f,.22,.12,'triangle',i*.11)); }
function sRoll(){ tone(200+Math.random()*120,.05,.07,'square'); }
function haptic(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }
window.toggleSound = function(){
  soundOn = !soundOn;
  try{ localStorage.setItem('picker_sound', soundOn?'1':'0'); }catch(e){}
  document.getElementById('soundTog').textContent = soundOn ? '🔊' : '🔇';
  if(soundOn) sPop();
};

// ── COLORS ──
const C=['#F97316','#F43F5E','#8B5CF6','#06B6D4','#10B981','#F59E0B','#3B82F6','#EC4899','#14B8A6','#EF4444'];
const CHEST_EM=['🎁','📦','🧧','🪄','🎊','💎','🎀','🏺','🎈','🎉','⭐','🌟'];
const FG_EM=['🐶','🐱','🐸','🐼','🦊','🐨','🐯','🦁','🐻','🐺','🦄','🐙'];
const EMOJI_LIST=['🍽️','🎮','🏆','🎵','📚','🌍','💼','🎯','🏃','🍕','🎲','⭐','🌟','🎪','🦁','🐯','🌈','💡','🔥','🎉','🎁','🌸','🍀','🦋','🎸','⚽','🏀','🎭','🎨','🚀'];
const DEFAULT_PUNISHMENTS=['請大家飲奶茶','負責訂位','發搞笑限動','講一個冷笑話','下次你揀'];

// ── GLOBALS ──
window._lists = [];
window._curListId = null;
window._curList = null;
window._appReady = false;

let curMode = 'chest';
let usePunish = true;
let dCount = 3;
let chestItems = [];
let ePool=[], eElim=[], eAngle=0, eSpinning=false, eDone=false;
let dRunning = false;
let fgMode = 'touch';
let fgT = {}, fgDone = false, fgRegistered = new Set();
let cfAF = null;
let modalMode = 'add'; // 'add' or 'edit'
let modalEditId = null;
let selectedEmoji = '🍽️';
let emojiOpen = false;

// ── INIT ──
window._initApp = function() {
  renderLists();
  // restore from localStorage
  try {
    const lc = localStorage.getItem('picker_v3');
    if (lc) {
      const d = JSON.parse(lc);
      if (d.lists && Array.isArray(d.lists) && window._lists.length === 0) {
        window._lists = d.lists;
      }
    }
  } catch(e) {}
  renderLists();
  // Init sound toggle icon
  const st = document.getElementById('soundTog');
  if (st) st.textContent = soundOn ? '🔊' : '🔇';
};

// ── NAVIGATION ──
function showPage(id) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
window.goHome = function() {
  window._curListId = null;
  window._curList = null;
  showPage('pgHome');
  renderLists();
};
window.openDicePage = function() {
  showPage('pgDice');
  initDiceFaces();
  document.getElementById('diceTotal').textContent='';
  document.getElementById('dicePlayBtn').textContent='🎲 開始搖骰子';
};

// ── LISTS ──
function saveLocal() {
  try { localStorage.setItem('picker_v3', JSON.stringify({lists: window._lists})); } catch(e) {}
}
function genId() { return 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2,5); }

window._renderLists = renderLists;
function renderLists() {
  const el = document.getElementById('listCards');
  if (!el) return;
  const lists = window._lists;
  if (lists.length === 0) {
    el.innerHTML = `<div style="text-align:center;padding:20px;color:var(--slm);font-size:14px">還未有列表，新增一個開始吧！</div>`;
    return;
  }
  el.innerHTML = lists.map((l,i) => `
    <div class="list-card" style="animation-delay:${.08+i*.06}s" onclick="openList('${l.id}')">
      <div class="card-emoji" style="background:${l.color||'#FFF7ED'}">${l.emoji||'🍽️'}</div>
      <div class="card-info">
        <div class="card-name">${l.name}</div>
        <div class="card-count">${(l.items||[]).length} 個選項</div>
      </div>
      <div class="card-arrow">›</div>
      <button class="card-del" onclick="event.stopPropagation();deleteList('${l.id}')">🗑️</button>
    </div>`).join('');
}

window.openList = function(id) {
  const list = window._lists.find(l=>l.id===id);
  if (!list) return;
  window._curListId = id;
  window._curList = list;
  if (!list.items) list.items = [];
  if (!list.punishments) list.punishments = [...DEFAULT_PUNISHMENTS];
  if (!list.weights) list.weights = {};
  useWeight = false;
  document.getElementById('wTog').className = 'tog';
  document.getElementById('wPanel').style.display = 'none';
  document.getElementById('listHeaderName').textContent = (list.emoji||'') + ' ' + list.name;
  document.getElementById('listHeaderCount').textContent = list.items.length + ' 個選項';
  curMode = 'chest';
  ePool=[]; eElim=[]; eAngle=0; eSpinning=false; eDone=false;
  renderItems(); renderPunish(); applyMode('chest');
  document.getElementById('listBackBtn').onclick = goHome;
  showPage('pgList');
};

window.deleteList = function(id) {
  if (!confirm('確定刪除呢個列表？')) return;
  window._lists = window._lists.filter(l=>l.id!==id);
  saveLocal();
  if (window.fbDeleteList) window.fbDeleteList(id);
  renderLists();
};

function saveCurrentList() {
  if (!window._curList) return;
  const idx = window._lists.findIndex(l=>l.id===window._curListId);
  if (idx>=0) window._lists[idx] = window._curList;
  saveLocal();
  if (window.fbSaveList) window.fbSaveList(window._curListId, window._curList);
  document.getElementById('listHeaderCount').textContent = (window._curList.items||[]).length + ' 個選項';
}

// ── ADD/EDIT MODAL ──
window.showAddModal = function(editId) {
  modalMode = editId ? 'edit' : 'add';
  modalEditId = editId || null;
  selectedEmoji = '🍽️';
  document.getElementById('modalTitle').textContent = editId ? '編輯列表' : '新增列表';
  document.getElementById('modalConfirm').textContent = editId ? '儲存' : '建立';
  document.getElementById('modalNameInput').value = '';
  document.getElementById('emojiBtn').textContent = selectedEmoji;
  document.getElementById('emojiPicker').style.display = 'none';
  emojiOpen = false;
  if (editId) {
    const l = window._lists.find(l=>l.id===editId);
    if (l) { document.getElementById('modalNameInput').value = l.name; selectedEmoji = l.emoji||'🍽️'; document.getElementById('emojiBtn').textContent = selectedEmoji; }
  }
  buildEmojiPicker();
  document.getElementById('modal').classList.add('show');
  setTimeout(()=>document.getElementById('modalNameInput').focus(), 300);
};
window.closeModal = function(e) {
  if (e && e.target !== document.getElementById('modal')) return;
  document.getElementById('modal').classList.remove('show');
  document.getElementById('emojiPicker').style.display='none';
  emojiOpen=false;
};
window.toggleEmojiPicker = function() {
  emojiOpen = !emojiOpen;
  document.getElementById('emojiPicker').style.display = emojiOpen ? 'flex' : 'none';
};
function buildEmojiPicker() {
  document.getElementById('emojiPicker').innerHTML = EMOJI_LIST.map(e=>
    `<button class="ep-btn${e===selectedEmoji?' on':''}" onclick="pickEmoji('${e}')">${e}</button>`
  ).join('');
}
window.pickEmoji = function(e) {
  selectedEmoji = e;
  document.getElementById('emojiBtn').textContent = e;
  buildEmojiPicker();
};
window.confirmModal = function() {
  const name = document.getElementById('modalNameInput').value.trim();
  if (!name) { showToast('請輸入列表名稱'); return; }
  if (modalMode === 'add') {
    const colors = ['#FFF7ED','#FFF1F2','#F0FDF4','#EFF6FF','#FDF4FF','#FFFBEB'];
    const newList = { id:genId(), name, emoji:selectedEmoji, color:colors[window._lists.length%colors.length], items:[], punishments:[...DEFAULT_PUNISHMENTS] };
    window._lists.push(newList);
    saveLocal();
    if (window.fbSaveList) window.fbSaveList(newList.id, newList);
    renderLists();
  }
  document.getElementById('modal').classList.remove('show');
};

// ── WEIGHT ──
let useWeight = false;
window.toggleW = function() {
  useWeight = !useWeight;
  document.getElementById('wTog').className = 'tog' + (useWeight ? ' on' : '');
  document.getElementById('wPanel').style.display = useWeight ? 'block' : 'none';
  renderW(); renderItems();
};
window.chgW = function(idx, d) {
  if (!window._curList) return;
  const name = window._curList.items[idx];
  if (!name) return;
  if (!window._curList.weights) window._curList.weights = {};
  window._curList.weights[name] = Math.max(1, Math.min(50, (window._curList.weights[name]||1) + d));
  sTick(); haptic(8);

function renderW() {

function wRand(pool) {

  const weights = (list && list.weights) || {};
  const ws = pool.map(it => weights[it]||1);

// ── CHEST ──
function buildChests(){
  const list=window._curList;
  const items=(list&&list.items)||[];
  const weights=(list&&list.weights)||{};
  const MAX=50;

  chestItems=[];
  if(!useWeight){
    // No weight: one box per item, shuffled
    chestItems=[...items].sort(()=>Math.random()-.5);
  } else {
    // Weight = exact number of boxes for that item, capped at MAX total
    const tot=items.reduce((a,it)=>a+(weights[it]||1),0);
    const scale=tot>MAX?MAX/tot:1;
    items.forEach(it=>{
      const slots=Math.max(1,Math.round((weights[it]||1)*scale));
      for(let s=0;s<slots;s++) chestItems.push(it);
    });
    // Shuffle
    for(let i=chestItems.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [chestItems[i],chestItems[j]]=[chestItems[j],chestItems[i]];
    }
  }

  document.getElementById('chestHint').textContent='👆 點一個 🎁 開啟';
  document.getElementById('chestGrid').innerHTML=chestItems.map((item,i)=>
    `<div class="chest-item" id="ci${i}" onclick="pickChest(${i})">
      <div class="chest-box" id="cb${i}">🎁</div>
      <div class="chest-num">${i+1}</div>
    </div>`).join('');
}
window.pickChest = function(idx){
  const item=document.getElementById('ci'+idx);
  if(!item||item.classList.contains('faded'))return;
  chestItems.forEach((_,i)=>{if(i!==idx)document.getElementById('ci'+i)?.classList.add('faded');});
  const box=document.getElementById('cb'+idx);
  // Phase 1: shake with anticipation
  sPop(); haptic(20);
  box.classList.add('shaking');
  let shakeTicks=0;
  const st=setInterval(()=>{shakeTicks++;sTick();haptic(8);if(shakeTicks>=4)clearInterval(st);},130);
  setTimeout(()=>{
    box.classList.remove('shaking');
    // Phase 2: golden burst + reveal
    box.classList.add('burst');
    sOpen(); haptic([30,40,60]);
    box.textContent=chestItems[idx];
    box.style.fontSize='13px';box.style.fontWeight='700';
    box.style.color='#92400E';box.style.background='linear-gradient(145deg,#FFFBEB,#FEF3C7)';box.style.borderColor='#F59E0B';
    box.classList.add('revealed');
    item.classList.add('faded');item.style.opacity='1';item.style.pointerEvents='none';
    setTimeout(()=>showR(chestItems[idx]),400);
  },580);
  document.getElementById('chestHint').textContent='🎉 開咗啦！按「重新洗牌」再玩';
};

// ── ELIM WHEEL ──
function eReset(){ePool=[];eElim=[];eAngle=0;eSpinning=false;eDone=false;window._elimRemaining=null;document.getElementById('eLog').innerHTML='';}
function startElim(){
  eReset();
  const list=window._curList;
  const items=(list&&list.items)||[];
  const weights=(list&&list.weights)||{};
  if(!useWeight){
    // No weight: one slot per item
    ePool=[...items];
  } else {
    // Weighted: expand pool proportionally (max 20 slots total to keep wheel readable)
    const ws=items.map(it=>weights[it]||1);
    const tot=ws.reduce((a,b)=>a+b,0);
    const SLOTS=Math.min(50, tot);
    ePool=[];
    items.forEach((it,i)=>{
      const slots=Math.max(1,Math.round(ws[i]/tot*SLOTS));
      for(let s=0;s<slots;s++) ePool.push(it);
    });
    // Shuffle
    for(let i=ePool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ePool[i],ePool[j]]=[ePool[j],ePool[i]];}
  }
  // Keep track of unique items left
  window._elimRemaining=new Set(items);
  buildWheelCanvas();updEInfo();resetRUI();updateBtn();
}
function showElimPreview(){
  const items=(window._curList&&window._curList.items)||[];
  const prev=ePool.length>0?ePool:[...items];
  const savedPool=ePool;ePool=prev;buildWheelCanvas();ePool=savedPool;
}

function shadeColor(hex,amt){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}
function drawSector(ctx,cx,cy,r,s,e2,baseColor,hl){
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,s,e2);ctx.closePath();
  if(hl){ ctx.fillStyle='#FCD34D'; }
  else {
    const grad=ctx.createRadialGradient(cx,cy,r*.2,cx,cy,r);
    grad.addColorStop(0,shadeColor(baseColor,28));
    grad.addColorStop(.75,baseColor);
    grad.addColorStop(1,shadeColor(baseColor,-22));
    ctx.fillStyle=grad;
  }
  ctx.fill();ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=2;ctx.stroke();
}
function drawWheelChrome(ctx,cx,cy,r){
  // Outer ring with depth
  ctx.beginPath();ctx.arc(cx,cy,r+1,0,2*Math.PI);
  ctx.strokeStyle='rgba(0,0,0,.08)';ctx.lineWidth=4;ctx.stroke();
  // Gloss highlight on top half
  const gloss=ctx.createLinearGradient(cx,cy-r,cx,cy);
  gloss.addColorStop(0,'rgba(255,255,255,.18)');
  gloss.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath();ctx.arc(cx,cy,r,Math.PI,2*Math.PI);ctx.closePath();
  ctx.fillStyle=gloss;ctx.fill();
  // Center hub with shadow
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.2)';ctx.shadowBlur=6;ctx.shadowOffsetY=2;
  ctx.beginPath();ctx.arc(cx,cy,16,0,2*Math.PI);ctx.fillStyle='#fff';ctx.fill();
  ctx.restore();
  ctx.beginPath();ctx.arc(cx,cy,16,0,2*Math.PI);ctx.strokeStyle='#E2E8F0';ctx.lineWidth=3;ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,7,0,2*Math.PI);ctx.fillStyle='#F97316';ctx.fill();
}
function buildWheelCanvas(hl){
  const cv=document.getElementById('wCanvas'),ctx=cv.getContext('2d');
  const cx=130,cy=130,r=124;
  ctx.clearRect(0,0,260,260);
  const n=ePool.length;
  const allItems=(window._curList&&window._curList.items)||[];
  if(!n){
    const preview=[...(window._curList&&window._curList.items)||[]];
    if(preview.length===0){ctx.fillStyle='#E2E8F0';ctx.beginPath();ctx.arc(cx,cy,r,0,2*Math.PI);ctx.fill();return;}
    const arc2=2*Math.PI/preview.length;
    preview.forEach((item,i)=>{
      const s=eAngle+i*arc2-Math.PI/2,e2=s+arc2;
      drawSector(ctx,cx,cy,r,s,e2,C[i%C.length],false);
      ctx.save();ctx.translate(cx,cy);ctx.rotate(s+arc2/2);ctx.textAlign='right';ctx.fillStyle='#fff';
      ctx.font=`bold ${preview.length>6?11:14}px -apple-system,sans-serif`;ctx.shadowColor='rgba(0,0,0,.3)';ctx.shadowBlur=3;
      ctx.fillText(item.length>5?item.slice(0,5)+'…':item,r-10,5);ctx.restore();
    });
    drawWheelChrome(ctx,cx,cy,r);
    return;
  }
  const arc=2*Math.PI/n;
  for(let i=0;i<n;i++){
    const s=eAngle+i*arc-Math.PI/2,e2=s+arc;
    drawSector(ctx,cx,cy,r,s,e2,C[allItems.indexOf(ePool[i])%C.length],hl===i);
    ctx.save();ctx.translate(cx,cy);ctx.rotate(s+arc/2);ctx.textAlign='right';ctx.fillStyle='#fff';
    ctx.font=`bold ${n>6?11:14}px -apple-system,sans-serif`;ctx.shadowColor='rgba(0,0,0,.3)';ctx.shadowBlur=3;
    ctx.fillText(ePool[i].length>5?ePool[i].slice(0,5)+'…':ePool[i],r-10,5);ctx.restore();
  }
  drawWheelChrome(ctx,cx,cy,r);
}

function updEInfo(){
  const remaining=window._elimRemaining?window._elimRemaining.size:ePool.length;
  const winner=window._elimRemaining&&window._elimRemaining.size===1?Array.from(window._elimRemaining)[0]:(ePool.length===1?ePool[0]:null);
  document.getElementById('eInfo').innerHTML=
    remaining>1?`剩低 <b>${remaining}</b> 個，按轉盤淘汰`:
    winner?`🏆 <b style="color:var(--go)">${winner}</b> 勝利！`:
    '按下開始淘汰轉盤';
}

function eSpinWheel(){
  if(eSpinning||ePool.length<=1)return;
  eSpinning=true;updateBtn();
  sPop(); haptic(15);
  const tot=(Math.random()*3+5)*2*Math.PI,dur=2800,t0=performance.now(),a0=eAngle;
  function ease(t){return 1-Math.pow(1-t,4);}
  let lastSeg=-1;
  const ptr=document.querySelector('#cElim .wptr');
  function spin(now){
    const p=Math.min((now-t0)/dur,1);eAngle=a0+tot*ease(p);buildWheelCanvas();
    // Tick when pointer crosses segment boundary
    const n=ePool.length,arc=2*Math.PI/n;
    const norm=(((-eAngle%(2*Math.PI))+(2*Math.PI))%(2*Math.PI));
    const seg=Math.floor(norm/arc)%n;
    if(seg!==lastSeg){
      lastSeg=seg;
      sTick(); haptic(5);
      if(ptr){ptr.classList.remove('bounce');void ptr.offsetWidth;ptr.classList.add('bounce');}
    }
    if(p<1)requestAnimationFrame(spin);else afterSpin();
  }
  requestAnimationFrame(spin);
  function afterSpin(){
    const n=ePool.length,arc=2*Math.PI/n;
    const norm=(((-eAngle%(2*Math.PI))+(2*Math.PI))%(2*Math.PI));
    const hi=Math.floor(norm/arc)%n,hitItem=ePool[hi];
    haptic([40,30,40]);
    let fc=0;
    function flash(){
      buildWheelCanvas(fc%2===0?hi:-1);
      if(fc%2===0){sTick();}
      fc++;
      if(fc<8)setTimeout(flash,fc%2===0?120:100);else setTimeout(()=>doElim(hi,hitItem),350);
    }
    flash();
  }
  function doElim(hi,hitItem){
    // Remove all copies of hitItem from pool (handles weighted duplicates)
    eElim.push(hitItem);
    ePool=ePool.filter(it=>it!==hitItem);
    if(window._elimRemaining) window._elimRemaining.delete(hitItem);

    // Update log - show unique eliminated items
    const remaining=window._elimRemaining?Array.from(window._elimRemaining):ePool;
    document.getElementById('eLog').innerHTML=
      eElim.filter((v,i,a)=>a.indexOf(v)===i).map(e=>`<span class="etag">❌ ${e}</span>`).join('')+
      (remaining.length===1?`<span class="ewtag">🏆 ${remaining[0]}</span>`:'');

    buildWheelCanvas();updEInfo();eSpinning=false;

    const winner=remaining.length===1?remaining[0]:(ePool.length===1?ePool[0]:null);
    if(winner){
      eDone=true;ePool=[winner];
      const pu=randP();showR(winner,true);setTimeout(()=>showCeleb(winner,pu),600);
    }
    updateBtn();
  }
}

function rollDice(){
  if(dRunning)return;dRunning=true;
  document.getElementById('diceTotal').textContent='搖緊...';
  sPop(); haptic(15);

  function tick(){
    for(let i=0;i<dCount;i++){const el=document.getElementById('df'+i);if(!el)continue;el.textContent=DICE_FACES[Math.floor(Math.random()*6)];if(step%2===0)el.classList.add('shake');else el.classList.remove('shake');}

    else{
      const final=Array.from({length:dCount},()=>Math.floor(Math.random()*6));
      let sum=0;final.forEach((v,i)=>{const el=document.getElementById('df'+i);if(el){el.textContent=DICE_FACES[v];el.classList.remove('shake');el.classList.remove('land');void el.offsetWidth;el.classList.add('land');}sum+=v+1;});

      document.getElementById('diceTotal').textContent=dCount>1?`總點數：${sum}`:`點數：${sum}`;
      dRunning=false;

function buildFgGrid(){
  const grid=document.getElementById('fgGrid');grid.innerHTML='';
  for(let i=0;i<12;i++){
    const cell=document.createElement('div');
    cell.className='fg-cell';cell.id='fgc'+i;cell.dataset.i=i;
    cell.innerHTML=`<span class="em" style="pointer-events:none">${FG_EM[i]}</span><span class="nm" style="pointer-events:none">${i+1}</span>`;
    if(fgMode==='touch'){
      cell.addEventListener('touchstart',function(e){if(fgDone)return;e.preventDefault();e.stopPropagation();for(const t of e.changedTouches){if(fgT[t.identifier]!==undefined)continue;if(Object.values(fgT).includes(i))continue;fgT[t.identifier]=i;cell.classList.add('held');updFgUI();}},{passive:false});
      cell.addEventListener('touchend',function(e){if(fgDone)return;e.preventDefault();e.stopPropagation();for(const t of e.changedTouches){if(fgT[t.identifier]===i){cell.classList.remove('held');delete fgT[t.identifier];updFgUI();}}},{passive:false});
      cell.addEventListener('touchcancel',function(e){for(const t of e.changedTouches){if(fgT[t.identifier]===i){cell.classList.remove('held');delete fgT[t.identifier];updFgUI();}}},{passive:false});
    } else {
      const toggle=function(e){if(fgDone)return;e.preventDefault();e.stopPropagation();if(fgRegistered.has(i)){fgRegistered.delete(i);cell.classList.remove('held');}else{fgRegistered.add(i);cell.classList.add('held');}updFgUI();};
      cell.addEventListener('click',toggle);cell.addEventListener('touchend',toggle,{passive:false});
    }
    grid.appendChild(cell);
  }
}
function updFgUI(){
  const n=fgMode==='touch'?Object.keys(fgT).length:fgRegistered.size;
  const btn=document.getElementById('fgBtn');
  if(n>=2){document.getElementById('fgCnt').textContent=`已登記 ${n} 人，準備好！`;btn.textContent=`🎲 開始抽籤（${n} 人）`;btn.classList.add('show');}
  else{document.getElementById('fgCnt').textContent=n===0?(fgMode==='touch'?'等緊大家放手指...':'等緊大家點格登記...'):'已登記 1 人，等多一人...';btn.classList.remove('show');}
}
function fgPick(){
  const held=fgMode==='touch'?Object.values(fgT):Array.from(fgRegistered);
  if(held.length<2||fgDone)return;
  fgDone=true;
  document.getElementById('fgBtn').classList.remove('show');
  document.getElementById('fgCnt').textContent='抽緊...';
  held.forEach(i=>{const c=document.getElementById('fgc'+i);if(c)c.style.background='rgba(255,255,255,.04)';});
  let fi=0;
  function flash(){
    held.forEach(i=>{const c=document.getElementById('fgc'+i);if(c)c.style.background='rgba(255,255,255,.04)';});
    const f=held[Math.floor(Math.random()*held.length)];const fc=document.getElementById('fgc'+f);
    if(fc)fc.style.background='rgba(252,211,77,.55)';
    sTick(); haptic(6);
    fi++;
    if(fi<14)setTimeout(flash,fi<6?100:fi<11?180:280);else setTimeout(fgReveal,300);
  }
  flash();
  function fgReveal(){
    held.forEach(i=>{const c=document.getElementById('fgc'+i);if(c)c.style.background='';});
    const wi=held[Math.floor(Math.random()*held.length)];
    sWin(); haptic([60,40,80,40,120]);
    held.forEach(i=>{
      const c=document.getElementById('fgc'+i);if(!c)return;c.classList.remove('held');
      if(i===wi){c.classList.add('winner');let pulse=0;const pt=setInterval(()=>{pulse++;c.style.background=pulse%2===0?'rgba(252,211,77,.5)':'rgba(252,211,77,.15)';if(pulse>=10){clearInterval(pt);c.style.background='rgba(252,211,77,.35)';}},300);}
      else c.classList.add('loser');
    });
    document.getElementById('fgWin').textContent=FG_EM[wi]+' 格'+(wi+1)+' 先手！';
    document.getElementById('fgCnt').textContent='🎉 結果出爐！';
    document.getElementById('fgRes').classList.add('show');
    startConf();setTimeout(stopConf,4500);
    const btn=document.getElementById('fgBtn');const nb=btn.cloneNode(true);btn.parentNode.replaceChild(nb,btn);
    nb.textContent='🔄 再玩一次';nb.classList.add('show');
    nb.addEventListener('click',openFg);nb.addEventListener('touchend',function(e){e.preventDefault();openFg();},{passive:false});
  }
}

// ── CELEB ──
function showCeleb(w,p){
  document.getElementById('cWin').textContent=w;
  const pd=document.getElementById('cPun');
  if(p){pd.textContent='🎁 '+p;pd.style.display='block';}else pd.style.display='none';
  document.getElementById('celeb').classList.add('show');startConf();
  sWin(); haptic([60,40,80,40,120]);
}
window.closeCeleb=function(e){if(e)e.stopPropagation();document.getElementById('celeb').classList.remove('show');stopConf();}
function startConf(){
  const cv=document.getElementById('ccanvas'),ctx=cv.getContext('2d');
  cv.width=window.innerWidth;cv.height=window.innerHeight;
  const CC=['#F97316','#F43F5E','#F59E0B','#10B981','#8B5CF6','#06B6D4','#FCD34D','#EC4899'];
  const ps=Array.from({length:130},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height-cv.height,w:Math.random()*10+5,h:Math.random()*5+3,col:CC[Math.floor(Math.random()*CC.length)],rot:Math.random()*Math.PI*2,rs:(Math.random()-.5)*.15,vx:(Math.random()-.5)*3,vy:Math.random()*4+2,op:1}));
  function fr(){ctx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.rot+=p.rs;if(p.y>cv.height*.7)p.op-=.015;if(p.y>cv.height+20){p.y=-10;p.x=Math.random()*cv.width;p.op=1;}ctx.save();ctx.globalAlpha=Math.max(0,p.op);ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.col;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});cfAF=requestAnimationFrame(fr);}
  if(cfAF)cancelAnimationFrame(cfAF);fr();
}
function stopConf(){if(cfAF){cancelAnimationFrame(cfAF);cfAF=null;}const cv=document.getElementById('ccanvas');cv.getContext('2d').clearRect(0,0,cv.width,cv.height);}

// ── SHARE ──
window.shareHome = function(){
  const url=location.href;
  if(navigator.share)navigator.share({title:'今次揀咩？',url});
  else navigator.clipboard.writeText(url).then(()=>showToast('連結已複製 🎉'));
};
window.shareList = function(){
  if(!window._curList)return;
  const d=btoa(encodeURIComponent(JSON.stringify({items:window._curList.items})));
  const url=location.origin+location.pathname+'?d='+d;
  if(navigator.share)navigator.share({title:window._curList.name,url});
  else navigator.clipboard.writeText(url).then(()=>showToast('連結已複製 🎉'));
};

// ── TOAST ──
function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2500);}

// ── FALLBACK if Firebase slow ──
setTimeout(()=>{if(!window._appReady){window._appReady=true;window._initApp();}},3000);
</script>
