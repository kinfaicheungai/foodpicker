<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="食咩">
<meta name="theme-color" content="#F97316">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23F97316'/%3E%3Ctext x='50' y='72' font-size='62' text-anchor='middle' font-family='sans-serif' fill='white'%3E食%3C/text%3E%3C/svg%3E">
<title>食咩？ v2.4</title>
<style>
:root{--or:#F97316;--ord:#EA6A00;--orl:#FFF7ED;--orm:#FFEDD5;--ro:#F43F5E;--go:#F59E0B;--sl:#1E293B;--slm:#475569;--sll:#F8FAFC;--bd:#E2E8F0;--wh:#fff;--r:14px;--rs:10px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"Helvetica Neue",sans-serif;background:linear-gradient(160deg,#FFF7ED,#FFF1F2);min-height:100vh;color:var(--sl);overscroll-behavior:none}
.wrap{max-width:480px;margin:0 auto;padding:16px 14px 110px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.logo{display:flex;align-items:center;gap:8px}
.logo-icon{width:40px;height:40px;border-radius:10px;background:var(--or);display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;font-weight:900}
.logo-text{font-size:20px;font-weight:800}
.logo-text em{color:var(--or);font-style:normal}
.logo-ver{font-size:11px;color:var(--slm);margin-left:4px;font-weight:500}
.hbtn{background:var(--wh);border:1px solid var(--bd);border-radius:50px;padding:7px 13px;font-size:13px;cursor:pointer;color:var(--slm)}
.card{background:var(--wh);border-radius:var(--r);box-shadow:0 1px 4px rgba(0,0,0,.07);padding:16px;margin-bottom:11px}
.clabel{font-size:11px;font-weight:700;color:var(--or);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.irow{display:flex;gap:8px}
.irow input{flex:1;border:1.5px solid var(--bd);border-radius:var(--rs);padding:10px 12px;font-size:15px;outline:none;background:var(--sll);color:var(--sl)}
.irow input:focus{border-color:var(--or);background:var(--wh)}
.badd{background:var(--or);color:#fff;border:none;border-radius:var(--rs);padding:10px 14px;font-size:20px;cursor:pointer;line-height:1}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:6px}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--orm);border-radius:50px;padding:5px 10px;font-size:14px;font-weight:500}
.tagw{font-size:11px;color:var(--or);font-weight:700}
.tx{background:none;border:none;color:#94A3B8;cursor:pointer;font-size:13px;padding:0;line-height:1}
.togrow{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.tog{width:42px;height:24px;background:var(--bd);border-radius:50px;position:relative;cursor:pointer;border:none;flex-shrink:0}
.tog.on{background:var(--or)}
.tog::after{content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:3px;left:3px;transition:transform .2s}
.tog.on::after{transform:translateX(18px)}
.wpanel{margin-top:10px;display:none}
.wpanel.open{display:block}
.wrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.wrow:last-child{border:none}
.wname{flex:1;font-size:14px}
.wbar-wrap{width:50px;height:5px;background:var(--bd);border-radius:3px;overflow:hidden}
.wbar{height:100%;background:var(--or);border-radius:3px}
.wbtn{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--bd);background:var(--sll);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.wval{min-width:20px;text-align:center;font-size:14px;font-weight:700;color:var(--or)}
.mtabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mtab{border:1.5px solid var(--bd);background:var(--sll);border-radius:var(--rs);padding:10px 6px;font-size:13px;font-weight:600;cursor:pointer;text-align:center;color:var(--slm)}
.mtab .ic{font-size:20px;display:block;margin-bottom:3px}
.mtab.on{border-color:var(--or);background:var(--orl);color:var(--or)}
.ptags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ptag{background:#FFF1F2;color:var(--ro);border-radius:50px;padding:5px 10px;font-size:13px;display:inline-flex;align-items:center;gap:4px}
/* Result */
.rarea{background:var(--sl);border-radius:var(--r);padding:22px;text-align:center;margin-bottom:11px;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rlbl{font-size:13px;color:#94A3B8;margin-bottom:6px}
.rwin{font-size:34px;font-weight:800;color:#FCD34D}
.rpun{background:rgba(244,63,94,.2);border-radius:50px;padding:6px 14px;font-size:14px;color:#FDA4AF;margin-top:8px}
.rempty{text-align:center}
.rei{font-size:36px;margin-bottom:5px}
.reh{font-size:14px;color:#64748B}
/* Buttons */
.bplay{width:100%;background:var(--or);color:#fff;border:none;border-radius:var(--r);padding:15px;font-size:17px;font-weight:800;cursor:pointer}
.bplay:disabled{background:#CBD5E1;cursor:not-allowed}
.bplay.red{background:var(--ro)}
.brow{display:flex;gap:8px;margin-top:8px}
.bsec{flex:1;background:var(--wh);border:1.5px solid var(--bd);border-radius:var(--rs);padding:11px;font-size:14px;font-weight:600;cursor:pointer;color:var(--slm)}
/* ── CHEST ── */
.chest-grid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:6px 0 8px}
.chest-item{width:76px;text-align:center;cursor:pointer}
.chest-box{
  width:76px;height:76px;border-radius:14px;
  background:var(--orl);border:2px solid var(--bd);
  display:flex;align-items:center;justify-content:center;
  font-size:32px;position:relative;overflow:hidden;
  transition:border-color .2s,background .2s;
}
.chest-item:hover .chest-box{border-color:var(--go);background:#FFFBEB}
.chest-item.picked .chest-box{border-color:var(--go);background:#FFFBEB;font-size:14px;font-weight:700;color:#92400E;padding:4px}
.chest-item.faded{opacity:.3;pointer-events:none}
.chest-item.picked.faded{opacity:.3}
.chest-num{font-size:11px;color:var(--slm);margin-top:4px}
.chest-hint{text-align:center;font-size:13px;color:var(--slm);margin-top:6px}
/* ── ELIM WHEEL ── */
.wheel-wrap{position:relative;display:flex;justify-content:center;align-items:center;padding:12px 0 8px}
.wptr{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:26px solid var(--ro);z-index:10}
.wctr{position:absolute;width:30px;height:30px;background:#fff;border-radius:50%;border:3px solid var(--bd);top:50%;left:50%;transform:translate(-50%,-50%);z-index:10}
.einfo{text-align:center;font-size:13px;color:var(--slm);margin-bottom:8px}
.einfo b{color:var(--ro)}
.elog{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.etag{background:#F1F5F9;color:#94A3B8;border-radius:50px;padding:4px 10px;font-size:13px;text-decoration:line-through}
.ewtag{background:#FEF3C7;color:#92400E;border:2px solid var(--go);border-radius:50px;padding:4px 12px;font-size:14px;font-weight:700}
/* ── DICE ── */
.dice-count-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.dice-count-lbl{font-size:14px;font-weight:600;color:var(--slm)}
.dice-count-btns{display:flex;gap:8px}
.dcb{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--bd);background:var(--sll);font-size:15px;font-weight:700;cursor:pointer;color:var(--slm);transition:all .2s}
.dcb.on{border-color:var(--or);background:var(--orl);color:var(--or)}
.dice-faces-wrap{display:flex;justify-content:center;gap:16px;padding:10px 0 8px;min-height:100px;align-items:center}
.d-face{font-size:56px;line-height:1;transition:transform .1s}
.d-face.shake{transform:rotate(20deg) scale(1.15)}
.dice-total{text-align:center;font-size:15px;color:var(--slm);min-height:24px;font-weight:600}
/* ── FINGER OVERLAY ── */
#fgOv{position:fixed;inset:0;z-index:8000;background:linear-gradient(160deg,#0F172A,#1E0A2E);display:none;flex-direction:column;touch-action:none}
#fgOv.show{display:flex}
.fg-hdr{display:flex;align-items:center;padding:max(env(safe-area-inset-top),14px) 16px 10px;flex-shrink:0}
.fg-back{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:50px;padding:8px 14px;color:#fff;font-size:14px;cursor:pointer}
.fg-ttl{flex:1;text-align:center;color:#fff;font-size:18px;font-weight:800;margin-right:70px}
.fg-bdy{flex:1;display:flex;flex-direction:column;padding:4px 14px max(env(safe-area-inset-bottom),16px);min-height:0}
.fg-hint{text-align:center;color:rgba(255,255,255,.55);font-size:13px;margin-bottom:8px;flex-shrink:0}
.fg-cnt{text-align:center;color:#FCD34D;font-size:15px;font-weight:700;margin-bottom:8px;flex-shrink:0}
.fg-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:8px;flex:1;min-height:0}
.fg-cell{border-radius:14px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:all .15s;user-select:none;-webkit-user-select:none}
.fg-cell .em{font-size:26px;pointer-events:none}
.fg-cell .nm{font-size:11px;color:rgba(255,255,255,.35);margin-top:2px;pointer-events:none}
.fg-cell.held{background:rgba(99,102,241,.45);border-color:#818CF8;transform:scale(.92)}
.fg-cell.winner{background:rgba(245,158,11,.35);border-color:#FCD34D;border-width:3px;animation:fgwin .5s ease-out}
.fg-cell.loser{opacity:.2;transform:scale(.88)}
@keyframes fgwin{0%{transform:scale(1)}40%{transform:scale(1.2)}70%{transform:scale(.95)}100%{transform:scale(1)}}
.fg-res{text-align:center;padding:10px;background:rgba(255,255,255,.08);border-radius:12px;margin-top:8px;flex-shrink:0;opacity:0;pointer-events:none;transition:opacity .3s}
.fg-res.show{opacity:1;pointer-events:auto}
.fg-res p{color:rgba(255,255,255,.6);font-size:13px;margin-bottom:4px}
.fg-res strong{color:#FCD34D;font-size:26px;display:block}
.fg-start{margin-top:8px;width:100%;background:var(--or);color:#fff;border:none;border-radius:12px;padding:14px;font-size:17px;font-weight:800;cursor:pointer;flex-shrink:0;opacity:0;pointer-events:none;transition:opacity .3s}
.fg-start.show{opacity:1;pointer-events:auto}
/* ── CELEB ── */
#celeb{position:fixed;inset:0;z-index:9000;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,10,20,.9);cursor:pointer}
#celeb.show{display:flex}
#ccanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cbox{position:relative;z-index:2;text-align:center;padding:28px 24px;animation:cpop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes cpop{0%{transform:scale(.4);opacity:0}65%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.clbl{font-size:14px;color:#94A3B8;margin-bottom:8px}
.cwin{font-size:52px;font-weight:900;color:#FCD34D;line-height:1.1;margin-bottom:12px}
.cpun{background:rgba(244,63,94,.25);border:1px solid rgba(244,63,94,.35);border-radius:50px;padding:8px 20px;font-size:15px;color:#FDA4AF;margin-bottom:22px}
.cclose{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.25);border-radius:50px;padding:11px 28px;font-size:14px;color:#fff;cursor:pointer;font-weight:600}
/* ── BOTTOM TAB BAR ── */
.btab-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--wh);border-top:1px solid var(--bd);
  display:grid;grid-template-columns:repeat(4,1fr);
  padding-bottom:env(safe-area-inset-bottom);
  z-index:100;
}
.btab{
  display:flex;flex-direction:column;align-items:center;
  padding:8px 4px 6px;cursor:pointer;border:none;background:none;
  color:var(--slm);font-size:11px;font-weight:600;gap:3px;
  transition:color .15s;
}
.btab .btic{font-size:22px;line-height:1}
.btab.on{color:var(--or)}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--sl);color:#fff;padding:10px 20px;border-radius:50px;font-size:14px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9999;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <div class="logo-icon">食</div>
      <div class="logo-text">今晚<em>食咩</em>？<span class="logo-ver">v2.4</span></div>
    </div>
    <button class="hbtn" onclick="shareApp()">📤 分享</button>
  </header>

  <div class="card">
    <div class="clabel">選項</div>
    <div class="irow">
      <input id="iInput" type="text" placeholder="加入餐廳 / 選項..." maxlength="10">
      <button class="badd" onclick="addItem()">＋</button>
    </div>
    <div class="tags" id="tagsEl"></div>
    <div class="togrow">
      <span style="font-size:13px;font-weight:600;color:var(--slm)">⚖️ 調整概率權重</span>
      <button class="tog" id="wTog" onclick="toggleW()"></button>
    </div>
    <div class="wpanel" id="wPanel"></div>
  </div>

  <div class="card" id="cChest">
    <div class="clabel">選一個寶箱</div>
    <div class="chest-grid" id="chestGrid"></div>
    <div class="chest-hint" id="chestHint">👆 點一個寶箱開啟</div>
  </div>

  <div class="card" id="cElim" style="display:none">
    <div class="clabel">淘汰轉盤</div>
    <div class="einfo" id="eInfo">按下開始淘汰轉盤</div>
    <div class="wheel-wrap">
      <div class="wptr"></div>
      <canvas id="wCanvas" width="260" height="260"></canvas>
      <div class="wctr"></div>
    </div>
    <div class="elog" id="eLog"></div>
  </div>

  <div class="card" id="cDice" style="display:none">
    <div class="clabel">骰子</div>
    <div class="dice-count-row">
      <span class="dice-count-lbl">骰子數量</span>
      <div class="dice-count-btns">
        <button class="dcb" id="dc1" onclick="setDiceCount(1)">1</button>
        <button class="dcb" id="dc2" onclick="setDiceCount(2)">2</button>
        <button class="dcb on" id="dc3" onclick="setDiceCount(3)">3</button>
      </div>
    </div>
    <div class="dice-faces-wrap" id="diceFaces"></div>
    <div class="dice-total" id="diceTotal"></div>
  </div>

  <div class="card">
    <div class="clabel">懲罰任務卡</div>
    <div class="togrow">
      <span style="font-size:14px;font-weight:600">抽到要有後果 😈</span>
      <button class="tog on" id="pTog" onclick="toggleP()"></button>
    </div>
    <div id="pSec">
      <div class="irow" style="margin-top:10px">
        <input id="pInput" type="text" placeholder="加懲罰..." maxlength="20">
        <button class="badd" onclick="addPunish()">＋</button>
      </div>
      <div class="ptags" id="pTags"></div>
    </div>
  </div>

  <div class="rarea" id="rArea">
    <div class="rempty"><div class="rei">🎁</div><div class="reh">點選寶箱揭曉答案</div></div>
  </div>
  <button class="bplay" id="playBtn" onclick="mainAct()">請先加入選項</button>
  <div class="brow">
    <button class="bsec" onclick="resetRound()">重設</button>
    <button class="bsec" onclick="shareApp()">📤 分享</button>
  </div>
</div>

<!-- Finger overlay -->
<div id="fgOv">
  <div class="fg-hdr">
    <button class="fg-back" id="fgBack">← 返回</button>
    <div class="fg-ttl">👆 手指抽籤</div>
  </div>
  <div class="fg-bdy">
    <div class="fg-hint">每人放一隻手指喺一格，≥2人後按「開始」</div>
    <div class="fg-cnt" id="fgCnt">等緊大家放手指...</div>
    <div class="fg-grid" id="fgGrid"></div>
    <div class="fg-res" id="fgRes"><p>🎉 先手係</p><strong id="fgWin"></strong></div>
    <button class="fg-start" id="fgBtn">🎲 開始抽籤</button>
  </div>
</div>

<!-- Celeb -->
<div id="celeb" onclick="closeCeleb()">
  <canvas id="ccanvas"></canvas>
  <div class="cbox">
    <div class="clbl">🎉 今晚就係</div>
    <div class="cwin" id="cWin"></div>
    <div class="cpun" id="cPun" style="display:none"></div>
    <button class="cclose" onclick="closeCeleb(event)">點擊關閉</button>
  </div>
</div>
<!-- Bottom tab bar -->
<div class="btab-bar">
  <button class="btab on" id="tabChest" onclick="setMode('chest')">
    <span class="btic">🎁</span>寶箱
  </button>
  <button class="btab" id="tabElim" onclick="setMode('elim')">
    <span class="btic">🎡</span>淘汰轉盤
  </button>
  <button class="btab" id="tabDice" onclick="setMode('dice')">
    <span class="btic">🎲</span>骰子
  </button>
  <button class="btab" id="tabFinger" onclick="setMode('finger')">
    <span class="btic">👆</span>手指抽籤
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
// ── COLORS ──
const C=['#F97316','#F43F5E','#8B5CF6','#06B6D4','#10B981','#F59E0B','#3B82F6','#EC4899','#14B8A6','#EF4444'];

// ── ALL VARS UP FRONT (avoid let/const hoisting issues) ──
const CHEST_EM=['🎁','📦','🧧','🪄','🎊','💎','🎀','🏺','🎈','🎉','⭐','🌟'];
const FG_EM=['🐶','🐱','🐸','🐼','🦊','🐨','🐯','🦁','🐻','🐺','🦄','🐙'];
let chestItems=[];
let ePool=[],eElim=[],eAngle=0,eSpinning=false,eDone=false;
let dRunning=false;
let fgT={},fgDone=false;
let cfAF=null;

// ── STATE ──
const LSK='fmp4'; // new key avoids old cache conflicts
let S={items:['火鍋','燒烤','壽司','川菜','泰國菜','茶餐廳'],weights:{},punishments:['請大家飲奶茶','負責訂位','發搞笑限動','講一個冷笑話','下次你揀'],usePunish:true,useWeight:false,mode:'chest'};

function save(){try{localStorage.setItem(LSK,JSON.stringify(S))}catch(e){}}
function load(){
  try{
    const r=localStorage.getItem(LSK);
    if(r){
      const d=JSON.parse(r);
      // Guard: only merge valid data
      if(d.items && Array.isArray(d.items) && d.items.length>=2) S.items=d.items;
      if(d.weights && typeof d.weights==='object') S.weights=d.weights;
      if(d.punishments && Array.isArray(d.punishments) && d.punishments.length>0) S.punishments=d.punishments;
      if(typeof d.usePunish==='boolean') S.usePunish=d.usePunish;
      if(typeof d.useWeight==='boolean') S.useWeight=d.useWeight;
      if(typeof d.mode==='string') S.mode=d.mode;
    }
  }catch(e){}
  // Load from URL share
  try{
    const p=new URLSearchParams(location.search);
    if(p.get('d')){
      const d=JSON.parse(decodeURIComponent(atob(p.get('d'))));
      if(d.items&&d.items.length>=2) S.items=d.items;
      if(d.punishments&&d.punishments.length>0) S.punishments=d.punishments;
    }
  }catch(e){}
  // Ensure weights exist for all items
  S.items.forEach(it=>{if(!S.weights[it])S.weights[it]=1;});
  // Never allow finger mode on boot (needs overlay)
  if(S.mode==='finger') S.mode='chest';
}

// ── BOOT ──
load();
renderItems(); renderW(); renderP();
applyMode(S.mode);

// ── ITEMS ──
function addItem(){
  const v=document.getElementById('iInput').value.trim();
  if(!v)return;
  if(!S.items.includes(v)){S.items.push(v);S.weights[v]=1;}
  document.getElementById('iInput').value='';
  save();renderItems();renderW();
  if(S.mode==='chest')buildChests();
  if(S.mode==='elim'){eReset();buildWheelCanvas();updEInfo();}
  updBtn();
}
function removeItem(i){
  delete S.weights[S.items[i]];S.items.splice(i,1);
  save();renderItems();renderW();
  if(S.mode==='chest')buildChests();
  if(S.mode==='elim'){eReset();buildWheelCanvas();updEInfo();}
  updBtn();
}
function renderItems(){
  document.getElementById('tagsEl').innerHTML=S.items.map((it,i)=>
    `<span class="tag">${it}${S.useWeight&&(S.weights[it]||1)>1?`<span class="tagw">x${S.weights[it]}</span>`:''}<button class="tx" onclick="removeItem(${i})">✕</button></span>`
  ).join('');
  updBtn();
}
document.getElementById('iInput').addEventListener('keydown',e=>{if(e.key==='Enter')addItem();});

// ── WEIGHT ──
function toggleW(){
  S.useWeight=!S.useWeight;
  document.getElementById('wTog').className='tog'+(S.useWeight?' on':'');
  document.getElementById('wPanel').className='wpanel'+(S.useWeight?' open':'');
  save();renderItems();renderW();
}
function chgW(n,d){S.weights[n]=Math.max(1,Math.min(5,(S.weights[n]||1)+d));save();renderW();renderItems();}
function renderW(){
  const mx=Math.max(...S.items.map(it=>S.weights[it]||1),1);
  document.getElementById('wPanel').innerHTML=S.items.map(it=>{
    const w=S.weights[it]||1;
    return `<div class="wrow"><span class="wname">${it}</span><div class="wbar-wrap"><div class="wbar" style="width:${Math.round(w/mx*100)}%"></div></div><button class="wbtn" onclick="chgW(${JSON.stringify(it)},-1)">−</button><span class="wval">${w}</span><button class="wbtn" onclick="chgW(${JSON.stringify(it)},1)">＋</button></div>`;
  }).join('');
}
function wRand(pool){
  const ws=pool.map(it=>S.weights[it]||1),tot=ws.reduce((a,b)=>a+b,0);
  let r=Math.random()*tot;
  for(let i=0;i<pool.length;i++){r-=ws[i];if(r<=0)return pool[i];}
  return pool[pool.length-1];
}

// ── PUNISH ──
function toggleP(){
  S.usePunish=!S.usePunish;
  document.getElementById('pTog').className='tog'+(S.usePunish?' on':'');
  document.getElementById('pSec').style.display=S.usePunish?'block':'none';
  save();
}
function addPunish(){const v=document.getElementById('pInput').value.trim();if(!v)return;S.punishments.push(v);document.getElementById('pInput').value='';save();renderP();}
function rmP(i){S.punishments.splice(i,1);save();renderP();}
function renderP(){
  document.getElementById('pTog').className='tog'+(S.usePunish?' on':'');
  document.getElementById('pSec').style.display=S.usePunish?'block':'none';
  document.getElementById('pTags').innerHTML=S.punishments.map((p,i)=>
    `<span class="ptag">${p}<button class="tx" onclick="rmP(${i})">✕</button></span>`).join('');
}
document.getElementById('pInput').addEventListener('keydown',e=>{if(e.key==='Enter')addPunish();});
function randP(){return S.usePunish&&S.punishments.length?S.punishments[Math.floor(Math.random()*S.punishments.length)]:null;}

// ── MODE ──
function setMode(m){S.mode=m;save();applyMode(m);}
function applyMode(m){
  // tabs
  ['Chest','Elim','Dice','Finger'].forEach(x=>document.getElementById('tab'+x).classList.remove('on'));
  const tmap={chest:'Chest',elim:'Elim',dice:'Dice',finger:'Finger'};
  if(tmap[m])document.getElementById('tab'+tmap[m]).classList.add('on');
  // cards
  document.getElementById('cChest').style.display=m==='chest'?'block':'none';
  document.getElementById('cElim').style.display=m==='elim'?'block':'none';
  document.getElementById('cDice').style.display=m==='dice'?'block':'none';
  // result + play btn visibility
  document.getElementById('rArea').style.display=(m==='finger'||m==='dice')?'none':'flex';
  document.getElementById('playBtn').style.display=m==='finger'?'none':'block';
  document.querySelector('.brow').style.display=m==='finger'?'none':'flex';
  // init content
  if(m==='chest'){buildChests();resetRUI();}
  if(m==='elim'){
    eReset();
    // Show items preview on wheel before game starts
    ePool=[...S.items];
    buildWheelCanvas();
    ePool=[];
    updEInfo();
    resetRUI();
  }
  if(m==='dice'){initDiceFaces();document.getElementById('diceTotal').textContent='';resetRUI();}
  if(m==='finger'){openFg();}
  updBtn();
}

// ── BTN ──
function updBtn(){
  const btn=document.getElementById('playBtn');
  const n=S.items.length;
  btn.disabled=false;btn.className='bplay';
  // Dice mode doesn't need items
  if(S.mode==='dice'){btn.textContent='🎲 開始搖骰子';return;}
  if(n<2){btn.disabled=true;btn.textContent='請先加入選項（最少2個）';return;}
  if(S.mode==='chest'){btn.textContent='🔀 重新洗牌寶箱';}
  else if(S.mode==='elim'){
    if(eSpinning){btn.disabled=true;btn.textContent='轉緊...';btn.className='bplay red';}
    else if(eDone){btn.textContent='🔄 重新開始';}
    else if(ePool.length===0){btn.textContent='▶ 開始淘汰轉盤';btn.className='bplay red';}
    else if(ePool.length===1){btn.textContent='🏆 已出勝利者';btn.disabled=true;}
    else{btn.textContent=`🎡 轉！淘汰（剩 ${ePool.length} 個）`;btn.className='bplay red';}
  }
}
function mainAct(){
  if(S.items.length<2)return;
  if(S.mode==='chest'){buildChests();resetRUI();}
  else if(S.mode==='elim'){
    if(eDone||ePool.length===0)startElim();
    else eSpinWheel();
  }
  else if(S.mode==='dice')rollDice();
}

// ── RESULT ──
function showR(winner,skipCeleb){
  const pu=randP();
  document.getElementById('rArea').innerHTML=
    `<div class="rlbl">今晚就係</div><div class="rwin">${winner}</div>`+
    (pu?`<div class="rpun">🎁 ${pu}</div>`:'');
  if(!skipCeleb)setTimeout(()=>showCeleb(winner,pu),400);
  return pu;
}
function resetRUI(){
  const h={chest:'點選寶箱揭曉答案',elim:'開始淘汰轉盤',dice:'按下開始搖'};
  const ic={chest:'🎁',elim:'🎡',dice:'🎲'};
  document.getElementById('rArea').innerHTML=
    `<div class="rempty"><div class="rei">${ic[S.mode]||'🎁'}</div><div class="reh">${h[S.mode]||''}</div></div>`;
}
function resetRound(){
  eReset();
  if(S.mode==='chest')buildChests();
  if(S.mode==='elim'){ePool=[...S.items];buildWheelCanvas();ePool=[];updEInfo();}
  if(S.mode==='dice'){initDiceFaces();document.getElementById('diceTotal').textContent='';}
  resetRUI();updBtn();
}

// ── CHEST ──
function buildChests(){
  chestItems=[...S.items].sort(()=>Math.random()-.5);
  document.getElementById('chestHint').textContent='👆 點一個寶箱開啟';
  document.getElementById('chestGrid').innerHTML=chestItems.map((item,i)=>
    `<div class="chest-item" id="ci${i}" onclick="pickChest(${i})">
      <div class="chest-box" id="cb${i}">${CHEST_EM[i%CHEST_EM.length]}</div>
      <div class="chest-num">寶箱${i+1}</div>
    </div>`
  ).join('');
}
function pickChest(idx){
  const item=document.getElementById('ci'+idx);
  if(!item||item.classList.contains('picked')||item.classList.contains('faded'))return;
  // Fade others
  chestItems.forEach((_,i)=>{
    if(i!==idx)document.getElementById('ci'+i)?.classList.add('faded');
  });
  // Animate open
  const box=document.getElementById('cb'+idx);
  box.style.transition='all .3s';
  box.style.transform='scale(1.15)';
  setTimeout(()=>{
    box.style.transform='scale(1)';
    box.textContent=chestItems[idx];
    box.style.fontSize='13px';
    box.style.fontWeight='700';
    box.style.color='#92400E';
    box.style.background='#FEF3C7';
    box.style.borderColor='#F59E0B';
    item.classList.add('picked');
    setTimeout(()=>showR(chestItems[idx]),300);
  },200);
  document.getElementById('chestHint').textContent='🎉 開咗啦！按「重新洗牌」再玩';
}

// ── ELIM WHEEL ──
function eReset(){ePool=[];eElim=[];eAngle=0;eSpinning=false;eDone=false;document.getElementById('eLog').innerHTML='';}
function startElim(){eReset();ePool=[...S.items];buildWheelCanvas();updEInfo();resetRUI();updBtn();}

function buildWheelCanvas(hl){
  const cv=document.getElementById('wCanvas'),ctx=cv.getContext('2d');
  const cx=130,cy=130,r=124;
  ctx.clearRect(0,0,260,260);
  const n=ePool.length;
  if(!n){ctx.fillStyle='#E2E8F0';ctx.beginPath();ctx.arc(cx,cy,r,0,2*Math.PI);ctx.fill();return;}
  const arc=2*Math.PI/n;
  for(let i=0;i<n;i++){
    const s=eAngle+i*arc-Math.PI/2,e2=s+arc;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,s,e2);ctx.closePath();
    ctx.fillStyle=hl===i?'#FCD34D':C[S.items.indexOf(ePool[i])%C.length];
    ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    ctx.save();ctx.translate(cx,cy);ctx.rotate(s+arc/2);
    ctx.textAlign='right';ctx.fillStyle='#fff';
    ctx.font=`bold ${n>6?11:14}px -apple-system,sans-serif`;
    ctx.shadowColor='rgba(0,0,0,.3)';ctx.shadowBlur=3;
    ctx.fillText(ePool[i].length>5?ePool[i].slice(0,5)+'…':ePool[i],r-10,5);
    ctx.restore();
  }
  ctx.beginPath();ctx.arc(cx,cy,16,0,2*Math.PI);
  ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#E2E8F0';ctx.lineWidth=3;ctx.stroke();
}

function updEInfo(){
  const n=ePool.length;
  document.getElementById('eInfo').innerHTML=
    n>1?`剩低 <b>${n}</b> 個，按轉盤淘汰`:
    n===1?`🏆 <b style="color:var(--go)">${ePool[0]}</b> 勝利！`:
    '按下開始淘汰轉盤';
}

function eSpinWheel(){
  if(eSpinning||ePool.length<=1)return;
  eSpinning=true;updBtn();
  const tot=(Math.random()*3+5)*2*Math.PI,dur=2800,t0=performance.now(),a0=eAngle;
  function ease(t){return 1-Math.pow(1-t,4);}
  // Phase 1: animate spin
  function spin(now){
    const p=Math.min((now-t0)/dur,1);
    eAngle=a0+tot*ease(p);
    buildWheelCanvas();
    if(p<1)requestAnimationFrame(spin);
    else afterSpin();
  }
  requestAnimationFrame(spin);
  // Phase 2: find hit + flash
  function afterSpin(){
    const n=ePool.length,arc=2*Math.PI/n;
    const norm=(((-eAngle%(2*Math.PI))+(2*Math.PI))%(2*Math.PI));
    const hi=Math.floor(norm/arc)%n;
    const hitItem=ePool[hi];
    let fc=0;
    function flash(){
      buildWheelCanvas(fc%2===0?hi:-1);fc++;
      if(fc<8)setTimeout(flash,fc%2===0?120:100);
      else setTimeout(()=>doElim(hi,hitItem),350);
    }
    flash();
  }
  // Phase 3: eliminate
  function doElim(hi,hitItem){
    ePool.splice(hi,1);eElim.push(hitItem);
    document.getElementById('eLog').innerHTML=
      eElim.map(e=>`<span class="etag">❌ ${e}</span>`).join('')+
      (ePool.length===1?`<span class="ewtag">🏆 ${ePool[0]}</span>`:'');
    buildWheelCanvas();updEInfo();
    eSpinning=false;
    if(ePool.length===1){
      eDone=true;
      const pu=randP();
      showR(ePool[0],true);
      setTimeout(()=>showCeleb(ePool[0],pu),600);
    }
    updBtn();
  }
}

// ── DICE ──
// ── DICE ──
const DICE_FACES=['⚀','⚁','⚂','⚃','⚄','⚅'];
let dCount=3;

function setDiceCount(n){
  dCount=n;
  [1,2,3].forEach(x=>document.getElementById('dc'+x).className='dcb'+(x===n?' on':''));
  initDiceFaces();
  document.getElementById('diceTotal').textContent='';
}
function initDiceFaces(){
  document.getElementById('diceFaces').innerHTML=
    Array.from({length:dCount},(_,i)=>`<span class="d-face" id="df${i}">🎲</span>`).join('');
}
function rollDice(){
  if(dRunning)return;
  dRunning=true;
  document.getElementById('diceTotal').textContent='搖緊...';
  document.getElementById('playBtn').disabled=true;
  let step=0;
  const total=20;
  function tick(){
    for(let i=0;i<dCount;i++){
      const el=document.getElementById('df'+i);
      if(!el)continue;
      el.textContent=DICE_FACES[Math.floor(Math.random()*6)];
      if(step%2===0)el.classList.add('shake');
      else el.classList.remove('shake');
    }
    step++;
    if(step<total){
      setTimeout(tick, step<8?60:step<15?110:170);
    } else {
      const final=Array.from({length:dCount},()=>Math.floor(Math.random()*6));
      let sum=0;
      final.forEach((v,i)=>{
        const el=document.getElementById('df'+i);
        if(el){el.textContent=DICE_FACES[v];el.classList.remove('shake');}
        sum+=v+1;
      });
      document.getElementById('diceTotal').textContent=dCount>1?`總點數：${sum}`:`點數：${sum}`;
      dRunning=false;
      document.getElementById('playBtn').disabled=false;
      document.getElementById('playBtn').textContent='🎲 再搖一次';
    }
  }
  tick();
}

// ── FINGER ──
function openFg(){
  fgT={};fgDone=false;
  document.getElementById('fgRes').classList.remove('show');
  document.getElementById('fgBtn').classList.remove('show');
  document.getElementById('fgBtn').textContent='🎲 開始抽籤';
  document.getElementById('fgCnt').textContent='等緊大家放手指...';

  // Bind start button - both click and touchend for Safari reliability
  const btn=document.getElementById('fgBtn');
  const newBtn=btn.cloneNode(true); // clone removes old listeners
  btn.parentNode.replaceChild(newBtn,btn);
  newBtn.addEventListener('click',fgPick);
  newBtn.addEventListener('touchend',function(e){e.preventDefault();fgPick();},{passive:false});

  // Bind back button
  const back=document.getElementById('fgBack');
  const newBack=back.cloneNode(true);
  back.parentNode.replaceChild(newBack,back);
  newBack.addEventListener('click',closeFg);
  newBack.addEventListener('touchend',function(e){e.preventDefault();closeFg();},{passive:false});

  buildFgGrid();
  document.getElementById('fgOv').classList.add('show');
}
function closeFg(){
  document.getElementById('fgOv').classList.remove('show');
  S.mode='chest';save();applyMode('chest');
}
function buildFgGrid(){
  const grid=document.getElementById('fgGrid');
  grid.innerHTML='';
  for(let i=0;i<12;i++){
    const cell=document.createElement('div');
    cell.className='fg-cell';
    cell.id='fgc'+i;
    cell.dataset.i=i;
    cell.innerHTML=`<span class="em" style="pointer-events:none">${FG_EM[i]}</span><span class="nm" style="pointer-events:none">${i+1}</span>`;
    // Bind directly to each cell
    cell.addEventListener('touchstart',function(e){
      if(fgDone)return;
      e.preventDefault();
      e.stopPropagation();
      for(const t of e.changedTouches){
        if(fgT[t.identifier]!==undefined)continue;
        if(Object.values(fgT).includes(i))continue;
        fgT[t.identifier]=i;
        cell.classList.add('held');
        updFgUI();
      }
    },{passive:false});
    cell.addEventListener('touchend',function(e){
      if(fgDone)return;
      e.preventDefault();
      e.stopPropagation();
      for(const t of e.changedTouches){
        if(fgT[t.identifier]===i){
          cell.classList.remove('held');
          delete fgT[t.identifier];
          updFgUI();
        }
      }
    },{passive:false});
    cell.addEventListener('touchcancel',function(e){
      for(const t of e.changedTouches){
        if(fgT[t.identifier]===i){
          cell.classList.remove('held');
          delete fgT[t.identifier];
          updFgUI();
        }
      }
    },{passive:false});
    grid.appendChild(cell);
  }
}
function updFgUI(){
  const n=Object.keys(fgT).length;
  const btn=document.getElementById('fgBtn');
  if(n>=2){
    document.getElementById('fgCnt').textContent=`已放 ${n} 隻手指，準備好！`;
    btn.textContent=`🎲 開始抽籤（${n} 人）`;
    btn.classList.add('show');
  } else {
    document.getElementById('fgCnt').textContent=n===0?'等緊大家放手指...':'已放 1 隻手指，等多一人...';
    btn.classList.remove('show');
  }
}
function fgPick(){
  const held=Object.values(fgT);
  if(held.length<2||fgDone)return;
  fgDone=true;
  document.getElementById('fgBtn').classList.remove('show');
  document.getElementById('fgCnt').textContent='抽緊...';
  let fi=0;
  // First: dim all held cells immediately
  held.forEach(i=>{
    const c=document.getElementById('fgc'+i);
    if(c) c.style.background='rgba(255,255,255,.04)';
  });
  // Then: randomly highlight one at a time, getting slower
  function flash(){
    // clear last highlight
    held.forEach(i=>{
      const c=document.getElementById('fgc'+i);
      if(c) c.style.background='rgba(255,255,255,.04)';
    });
    // light up one random cell
    const f=held[Math.floor(Math.random()*held.length)];
    const fc=document.getElementById('fgc'+f);
    if(fc) fc.style.background='rgba(252,211,77,.55)';
    fi++;
    if(fi<14) setTimeout(flash, fi<6?100:fi<11?180:280);
    else setTimeout(fgReveal,300);
  }
  flash();
  function fgReveal(){
    held.forEach(i=>{const c=document.getElementById('fgc'+i);if(c)c.style.background='';});
    const wi=held[Math.floor(Math.random()*held.length)];
    held.forEach(i=>{
      const c=document.getElementById('fgc'+i);if(!c)return;
      c.classList.remove('held');
      if(i===wi){
        c.classList.add('winner');
        // pulse the winner cell
        let pulse=0;
        const pTimer=setInterval(()=>{
          pulse++;
          c.style.background=pulse%2===0?'rgba(252,211,77,.5)':'rgba(252,211,77,.15)';
          if(pulse>=10){clearInterval(pTimer);c.style.background='rgba(252,211,77,.35)';}
        },300);
      } else {
        c.classList.add('loser');
      }
    });
    document.getElementById('fgWin').textContent=FG_EM[wi]+' 格'+(wi+1)+' 先手！';
    document.getElementById('fgCnt').textContent='🎉 結果出爐！';
    document.getElementById('fgRes').classList.add('show');
    startConf();setTimeout(stopConf,4500);
    // Rebind replay button
    const btn=document.getElementById('fgBtn');
    const newBtn=btn.cloneNode(true);
    btn.parentNode.replaceChild(newBtn,btn);
    newBtn.textContent='🔄 再玩一次';
    newBtn.classList.add('show');
    newBtn.addEventListener('click',openFg);
    newBtn.addEventListener('touchend',function(e){e.preventDefault();openFg();},{passive:false});
  }
}

// ── CELEB ──
function showCeleb(w,p){
  document.getElementById('cWin').textContent=w;
  const pd=document.getElementById('cPun');
  if(p){pd.textContent='🎁 '+p;pd.style.display='block';}else pd.style.display='none';
  document.getElementById('celeb').classList.add('show');
  startConf();
}
function closeCeleb(e){if(e)e.stopPropagation();document.getElementById('celeb').classList.remove('show');stopConf();}
function startConf(){
  const cv=document.getElementById('ccanvas'),ctx=cv.getContext('2d');
  cv.width=window.innerWidth;cv.height=window.innerHeight;
  const CC=['#F97316','#F43F5E','#F59E0B','#10B981','#8B5CF6','#06B6D4','#FCD34D','#EC4899'];
  const ps=Array.from({length:130},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height-cv.height,w:Math.random()*10+5,h:Math.random()*5+3,col:CC[Math.floor(Math.random()*CC.length)],rot:Math.random()*Math.PI*2,rs:(Math.random()-.5)*.15,vx:(Math.random()-.5)*3,vy:Math.random()*4+2,op:1}));
  function fr(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.rot+=p.rs;
      if(p.y>cv.height*.7)p.op-=.015;
      if(p.y>cv.height+20){p.y=-10;p.x=Math.random()*cv.width;p.op=1;}
      ctx.save();ctx.globalAlpha=Math.max(0,p.op);ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.fillStyle=p.col;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();
    });
    cfAF=requestAnimationFrame(fr);
  }
  if(cfAF)cancelAnimationFrame(cfAF);
  fr();
}
function stopConf(){if(cfAF){cancelAnimationFrame(cfAF);cfAF=null;}const cv=document.getElementById('ccanvas');cv.getContext('2d').clearRect(0,0,cv.width,cv.height);}

// ── SHARE ──
function shareApp(){
  const d=btoa(encodeURIComponent(JSON.stringify({items:S.items,punishments:S.punishments})));
  const url=location.origin+location.pathname+'?d='+d;
  if(navigator.share)navigator.share({title:'食咩？',text:'一齊抽！',url});
  else navigator.clipboard.writeText(url).then(()=>showToast('連結已複製 🎉'));
}
function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2500);}
